<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Skilt med QR-kode på en disk ved siden af en telefon, der viser et stempelkort uden app">
  <rect width="1200" height="630" fill="#f6f4ee"/>

  <!-- Disk -->
  <rect x="120" y="470" width="960" height="18" rx="9" fill="#2c324e" opacity="0.15"/>

  <!-- Skilt med QR -->
  <g>
    <rect x="220" y="150" width="260" height="300" rx="8" fill="#2c324e"/>
    <rect x="252" y="186" width="120" height="12" rx="6" fill="#ffffff" opacity="0.5"/>
    <rect x="252" y="212" width="180" height="16" rx="8" fill="#ffffff" opacity="0.85"/>

    <!-- QR-kode -->
    <rect x="272" y="256" width="156" height="156" rx="6" fill="#ffffff"/>
    <g fill="#2c324e">
      <rect x="288" y="272" width="36" height="36" rx="4"/>
      <rect x="376" y="272" width="36" height="36" rx="4"/>
      <rect x="288" y="360" width="36" height="36" rx="4"/>
      <rect x="336" y="272" width="14" height="14"/><rect x="336" y="298" width="14" height="14"/>
      <rect x="350" y="330" width="14" height="14"/><rect x="376" y="330" width="14" height="14"/>
      <rect x="402" y="330" width="14" height="14"/><rect x="336" y="360" width="14" height="14"/>
      <rect x="362" y="374" width="14" height="14"/><rect x="390" y="360" width="14" height="14"/>
      <rect x="402" y="386" width="14" height="14"/><rect x="362" y="402" width="14" height="14"/>
    </g>
    <!-- Fod -->
    <path d="M262 450l-24 40h204l-24-40z" fill="#0f2440"/>
  </g>

  <!-- Pil fra skilt til telefon -->
  <path d="M540 320h120" stroke="#51624a" stroke-width="8" stroke-linecap="round"/>
  <path d="M648 300l32 20-32 20z" fill="#51624a"/>

  <!-- Telefon med stempelkort -->
  <g>
    <rect x="720" y="110" width="280" height="410" rx="34" fill="#2c324e"/>
    <rect x="736" y="126" width="248" height="378" rx="24" fill="#ffffff"/>
    <rect x="820" y="140" width="80" height="10" rx="5" fill="#2c324e" opacity="0.25"/>

    <!-- Kort i telefonen -->
    <rect x="760" y="176" width="200" height="150" rx="8" fill="#51624a"/>
    <rect x="780" y="198" width="90" height="10" rx="5" fill="#ffffff" opacity="0.6"/>
    <rect x="780" y="218" width="130" height="14" rx="7" fill="#ffffff" opacity="0.9"/>
    <g fill="#ffffff">
      <circle cx="792" cy="272" r="13" opacity="0.95"/><circle cx="828" cy="272" r="13" opacity="0.95"/>
      <circle cx="864" cy="272" r="13" opacity="0.95"/>
      <circle cx="900" cy="272" r="13" opacity="0.3"/><circle cx="936" cy="272" r="13" opacity="0.3"/>
    </g>

    <!-- "Ingen app" — ingen App Store, bare browseren -->
    <rect x="760" y="356" width="200" height="44" rx="8" fill="#f6f4ee"/>
    <rect x="780" y="372" width="120" height="12" rx="6" fill="#2c324e" opacity="0.35"/>
    <rect x="760" y="416" width="200" height="44" rx="8" fill="#f6f4ee"/>
    <rect x="780" y="432" width="90" height="12" rx="6" fill="#2c324e" opacity="0.2"/>
  </g>
</svg>
