    .uid { font: 400 18px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1e1c1a; opacity: .5; }
  </style>
  <rect width="1200" height="630" fill="#f6f4ee"/>
  <rect x="120" y="546" width="960" height="16" rx="8" fill="#1e1c1a" opacity="0.12"/>

  <g>
