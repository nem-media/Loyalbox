<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Reviewstander med QR-kode og NFC-felt, og en telefon der holdes hen til NFC-feltet">
  <rect width="1200" height="630" fill="#f6f4ee"/>
  <rect x="120" y="500" width="960" height="18" rx="9" fill="#1e1c1a" opacity="0.15"/>

  <!-- Standeren, stor og central -->
  <g>
    <rect x="300" y="90" width="380" height="390" rx="10" fill="#1e1c1a"/>
    <rect x="300" y="90" width="380" height="390" rx="10" fill="none" stroke="#0f2440" stroke-width="2"/>

    <!-- Logo-plads + overskrift -->
    <circle cx="490" cy="146" r="22" fill="#ffffff" opacity="0.25"/>
    <rect x="400" y="188" width="180" height="16" rx="8" fill="#ffffff" opacity="0.9"/>
    <rect x="430" y="216" width="120" height="10" rx="5" fill="#ffffff" opacity="0.45"/>

    <!-- Delelinje -->
    <rect x="340" y="252" width="300" height="2" fill="#ffffff" opacity="0.15"/>

    <!-- QR til venstre -->
    <rect x="342" y="278" width="140" height="140" rx="6" fill="#ffffff"/>
    <g fill="#1e1c1a">
      <rect x="358" y="294" width="32" height="32" rx="4"/>
      <rect x="434" y="294" width="32" height="32" rx="4"/>
      <rect x="358" y="370" width="32" height="32" rx="4"/>
      <rect x="402" y="294" width="14" height="14"/><rect x="402" y="322" width="14" height="14"/>
      <rect x="416" y="350" width="14" height="14"/><rect x="444" y="350" width="14" height="14"/>
      <rect x="402" y="378" width="14" height="14"/><rect x="444" y="378" width="14" height="14"/>
      <rect x="430" y="404" width="14" height="14"/>
    </g>
    <rect x="352" y="432" width="120" height="10" rx="5" fill="#ffffff" opacity="0.5"/>

    <!-- NFC til højre -->
    <g transform="translate(500 278)">
      <rect width="140" height="140" rx="6" fill="#ffffff" opacity="0.08"/>
      <g fill="none" stroke="#b4a189" stroke-width="8" stroke-linecap="round">
        <path d="M52 46a34 34 0 0 1 0 48"/>
        <path d="M74 30a58 58 0 0 1 0 80"/>
        <path d="M96 14a82 82 0 0 1 0 112"/>
      </g>
      <circle cx="36" cy="70" r="9" fill="#b4a189"/>
    </g>
    <rect x="510" y="432" width="120" height="10" rx="5" fill="#ffffff" opacity="0.5"/>

    <!-- Fod -->
    <path d="M348 480l-32 46h348l-32-46z" fill="#0f2440"/>
  </g>

  <!-- Telefon der tapper -->
  <g transform="rotate(-14 860 300)">
    <rect x="760" y="170" width="200" height="330" rx="28" fill="#1e1c1a"/>
    <rect x="774" y="184" width="172" height="302" rx="18" fill="#ffffff"/>
    <rect x="828" y="196" width="64" height="8" rx="4" fill="#1e1c1a" opacity="0.25"/>
    <rect x="796" y="240" width="128" height="12" rx="6" fill="#1e1c1a" opacity="0.35"/>
    <g fill="#b4a189">
      <path d="M812 300l7 14 15 2-11 11 3 15-14-8-14 8 3-15-11-11 15-2z"/>
      <path d="M852 300l7 14 15 2-11 11 3 15-14-8-14 8 3-15-11-11 15-2z"/>
      <path d="M892 300l7 14 15 2-11 11 3 15-14-8-14 8 3-15-11-11 15-2z"/>
    </g>
    <rect x="796" y="360" width="128" height="36" rx="8" fill="#4a6b47"/>
  </g>
</svg>
