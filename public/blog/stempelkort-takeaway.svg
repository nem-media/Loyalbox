        <rect x="330" y="406" width="8" height="8"/><rect x="346" y="418" width="8" height="8"/>
        <rect x="358" y="406" width="8" height="8"/><rect x="330" y="434" width="8" height="8"/>
        <rect x="358" y="434" width="8" height="8"/><rect x="314" y="406" width="8" height="8"/>
      </g>
