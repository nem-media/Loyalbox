<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Pizzaæske og en papirspose på en takeaway-disk ved siden af et skilt med QR-kode og en telefon med stempelkort">
