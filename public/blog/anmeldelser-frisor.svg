<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Frisørstol foran et spejl med en saks og en kam, ved siden af en telefon der viser en anmeldelse med stjerner">
  <rect width="1200" height="630" fill="#f6f4ee"/>

  <!-- Gulvlinje -->
  <rect x="60" y="536" width="1080" height="14" rx="7" fill="#2c324e" opacity="0.16"/>

  <!-- ================================================== Spejl paa vaeggen -->
  <g>
    <rect x="132" y="72" width="300" height="330" rx="150" fill="#ffffff"/>
    <rect x="132" y="72" width="300" height="330" rx="150" fill="none" stroke="#2c324e" stroke-width="4" opacity="0.2"/>
    <!-- Spejlglans -->
    <path d="M198 150 q46 -52 108 -56" fill="none" stroke="#2c324e" stroke-width="7" stroke-linecap="round" opacity="0.08"/>
    <path d="M186 200 q30 -44 74 -62" fill="none" stroke="#2c324e" stroke-width="5" stroke-linecap="round" opacity="0.06"/>
  </g>

  <!-- ==================================================== Frisoerstolen -->
  <g>
    <!-- Ryglaen -->
    <path d="M262 300 h140 a30 30 0 0 1 30 30 v96 h-200 v-96 a30 30 0 0 1 30 -30 z" fill="#2c324e" opacity="0.82"/>
    <!-- Saede -->
    <rect x="222" y="426" width="220" height="40" rx="14" fill="#2c324e" opacity="0.6"/>
    <!-- Soejle -->
    <rect x="316" y="466" width="32" height="56" rx="8" fill="#2c324e" opacity="0.35"/>
    <!-- Fod -->
    <ellipse cx="332" cy="530" rx="86" ry="16" fill="#2c324e" opacity="0.28"/>
  </g>

  <!-- ============================================ Saks og kam paa bordet -->
  <!-- Saks -->
  <g transform="translate(548 372) rotate(-14)" stroke="#2c324e" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.75">
    <path d="M0 0 L104 74"/>
    <path d="M0 74 L104 0"/>
    <circle cx="-12" cy="-9" r="15"/>
    <circle cx="-12" cy="83" r="15"/>
  </g>
  <!-- Kam -->
  <g transform="translate(536 470)" opacity="0.6">
    <rect x="0" y="0" width="164" height="22" rx="8" fill="#2c324e"/>
    <g fill="#2c324e">
      <rect x="10" y="22" width="7" height="26" rx="3"/>
      <rect x="30" y="22" width="7" height="26" rx="3"/>
      <rect x="50" y="22" width="7" height="26" rx="3"/>
      <rect x="70" y="22" width="7" height="26" rx="3"/>
      <rect x="90" y="22" width="7" height="26" rx="3"/>
      <rect x="110" y="22" width="7" height="26" rx="3"/>
      <rect x="130" y="22" width="7" height="26" rx="3"/>
      <rect x="147" y="22" width="7" height="26" rx="3"/>
    </g>
  </g>

  <!-- ==================================== Telefon med anmeldelse og stjerner -->
  <g>
    <rect x="800" y="112" width="248" height="386" rx="30" fill="#2c324e"/>
    <rect x="814" y="130" width="220" height="350" rx="18" fill="#ffffff"/>
    <rect x="884" y="122" width="80" height="7" rx="3.5" fill="#ffffff" opacity="0.5"/>

    <!-- Salonnavn -->
    <rect x="840" y="164" width="126" height="14" rx="7" fill="#2c324e" opacity="0.75"/>
    <rect x="840" y="188" width="84" height="10" rx="5" fill="#2c324e" opacity="0.25"/>

    <!-- Fem stjerner -->
    <g fill="#f59e0b">
      <path d="M851 236 l6.5 13.2 14.6 2.1 -10.5 10.3 2.5 14.5 -13.1 -6.9 -13.1 6.9 2.5 -14.5 -10.5 -10.3 14.6 -2.1 z"/>
      <path d="M892 236 l6.5 13.2 14.6 2.1 -10.5 10.3 2.5 14.5 -13.1 -6.9 -13.1 6.9 2.5 -14.5 -10.5 -10.3 14.6 -2.1 z"/>
      <path d="M933 236 l6.5 13.2 14.6 2.1 -10.5 10.3 2.5 14.5 -13.1 -6.9 -13.1 6.9 2.5 -14.5 -10.5 -10.3 14.6 -2.1 z"/>
      <path d="M974 236 l6.5 13.2 14.6 2.1 -10.5 10.3 2.5 14.5 -13.1 -6.9 -13.1 6.9 2.5 -14.5 -10.5 -10.3 14.6 -2.1 z"/>
      <path d="M1015 236 l6.5 13.2 14.6 2.1 -10.5 10.3 2.5 14.5 -13.1 -6.9 -13.1 6.9 2.5 -14.5 -10.5 -10.3 14.6 -2.1 z"/>
    </g>

    <!-- Anmeldelsestekst -->
    <rect x="840" y="306" width="176" height="11" rx="5.5" fill="#2c324e" opacity="0.16"/>
    <rect x="840" y="330" width="158" height="11" rx="5.5" fill="#2c324e" opacity="0.16"/>
    <rect x="840" y="354" width="120" height="11" rx="5.5" fill="#2c324e" opacity="0.16"/>

    <!-- Svar fra salonen: indrykket, fordi svaret er halvdelen af pointen -->
    <rect x="858" y="390" width="158" height="9" rx="4.5" fill="#51624a" opacity="0.45"/>
    <rect x="858" y="408" width="128" height="9" rx="4.5" fill="#51624a" opacity="0.3"/>
    <rect x="840" y="386" width="3" height="34" rx="1.5" fill="#51624a"/>

    <rect x="840" y="444" width="176" height="24" rx="7" fill="#51624a"/>
  </g>
</svg>
